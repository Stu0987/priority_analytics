<header class="site-header">

    <div class="container site-header__inner">

        <div class="site-header__brand">
            <span class="site-brand">
                Priority<span class="site-brand__accent">/Analytics</span>
            </span>
        </div>

        <div class="site-header__context">
            {% if header_title %}
                <h1 class="site-header__title">
                    {{ header_title }}
                </h1>
            {% endif %}

            {% if header_subtitle %}
                <p class="site-header__subtitle">
                    {{ header_subtitle }}
                </p>
            {% endif %}

            <nav class="site-nav" aria-label="Primary navigation">
                <ul class="site-nav__list">
                    {# Navigation links will be added after main and users URLs exist. #}
                </ul>
            </nav>
        </div>

        <div class="site-header__auth">
            {# Authentication controls will be added after users URLs exist. #}
        </div>

    </div>

</header>
